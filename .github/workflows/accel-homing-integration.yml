name: Accelerometer homing integration validation
on:
  push:
    branches:
      - codex/simple-g-calibration-validation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy matplotlib
      - name: Run offline suite
        run: python -B -m unittest discover -s Beacon_Accel_Homing/tests -v > test-results.txt 2>&1
      - name: Retain source and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accel-homing-integration-source
          path: |
            Beacon_Accel_Homing/
            test-results.txt
          retention-days: 1
