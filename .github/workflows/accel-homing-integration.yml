name: Accelerometer homing integration validation
on:
  push:
    branches:
      - codex/simple-g-calibration-validation
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize hash-verified tested changes
        run: python .github/integration/apply_delta.py
      - name: Install test dependencies
        run: python -m pip install numpy matplotlib
      - name: Run full offline suite
        run: python -B -m unittest discover -s Beacon_Accel_Homing/tests -v > test-results.txt 2>&1
      - name: Verify and publish tested staging snapshot
        run: |
          python .github/integration/apply_delta.py --verify --stage > integration-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Validate integrated 20 mm vector calibration and ten-check retry workflow'
          git push origin HEAD:refs/heads/codex/simple-g-calibration-validation
          git rev-parse HEAD > validated-commit.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accel-homing-integration-source
          path: |
            Beacon_Accel_Homing/
            test-results.txt
            integration-manifest.json
            validated-commit.txt
          retention-days: 1
