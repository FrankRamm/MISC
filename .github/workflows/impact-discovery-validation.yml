name: Impact-after-20mm calibration validation
on:
  push:
    branches:
      - codex/impact-after-20mm-validation
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact tested source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python .github/apply-impact-discovery.py
          git diff --check
      - name: Install test dependencies
        run: python -m pip install 'matplotlib<4' numpy
      - name: Run all offline tests
        run: |
          set -o pipefail
          python -B -m unittest discover -s Beacon_Accel_Homing/tests -v 2>&1 | tee /tmp/impact-discovery-tests.txt
          grep -Eq '^Ran 708 tests in ' /tmp/impact-discovery-tests.txt
          grep -qx 'OK' /tmp/impact-discovery-tests.txt
      - name: Verify and publish only the staging snapshot
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/impact-discovery-manifest.json').read_text())
          for name, expected in manifest.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() == expected
          log = Path('/tmp/impact-discovery-tests.txt').read_text()
          summary = log[log.rfind('\nRan '):].strip()
          Path('.github/impact-discovery-validation.json').write_text(json.dumps({'result': 'passed', 'tests': 708, 'summary': summary, 'file_blobs': manifest}, indent=2) + '\n')
          print(summary)
          PY
          git add -- Beacon_Accel_Homing .github/impact-discovery-validation.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Validate impact-after-20mm discovery and selected-axis centering'
          git push origin HEAD:refs/heads/codex/impact-after-20mm-validation
          git rev-parse HEAD
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-discovery-verification
          retention-days: 1
          path: /tmp/impact-discovery-tests.txt
