# Editable example, not an additional duplicate of the installer-created section.
# Configure your normal accelerometer/MCU firmware and axes_map separately first.
# Install/update automatically restarts the verified selected systemd service
# after an idle recheck; it may request your sudo password. --no-restart opts out.
# After that opt-out, uninstall or module-link rollback, manually restart the
# selected Klipper host process while idle, using the printed service.
# Console RESTART is sufficient for later configuration-only threshold edits;
# RESTART/FIRMWARE_RESTART do not reload already imported Python modules.
[accel_homing]
accel_chip: auto
#    Exactly one recognized configured object is required for auto.
#    Otherwise use its full section name, for example adxl345 toolhead, beacon,
#    lis2dw toolhead, or adxl345 ToolHead (suffix case is preserved).
#    Cartographer's [scanner]/probe section is not an accelerometer: configure
#    and select its separate standard [adxl345 ...] or [lis2dw ...] object.

#x_threshold: 8.0
#y_threshold: 8.0
#    Independent manual overrides in g; commented by default so a saved model
#    can supply each axis. Explicit values win over model values on restart.
#    Manual overrides accept 3-15g; calibrated models can start at 0.5g.
#    Default generic threshold is sensor-aware, normally 8g for a 16g driver,
#    4g for the verified 8g MPU9250 driver. Do not paste 8g for MPU9250.
#threshold: 8.0
#    Historical shared fallback. Explicit threshold also overrides both model
#    defaults; leave it absent when using calibrated per-axis models.
#model: default
#    Named [accel_homing_model default] stored by SAVE_CONFIG in printer.cfg.
#    Do not paste or edit the generated model in the DO NOT EDIT block.

#x_impact_sign: 0
#y_impact_sign: 0
#    0 uses automatic direction detection. 1/-1 are expert overrides for the
#    already machine-mapped acceleration. Wrong signs can miss the stop.
#homing_accel: 5000
#    Upper limit while homing; never raises the configured printer acceleration.
#back_off_dist: 5
#    Optional cross-axis release in the original endstop path, mm.
#enable_settle_time: 0.25
#    Seconds after enabling a disabled homing motor; finite values 0-2.
#    CoreXY enables both drives. Zero retains the fresh quiet-data check.
#baseline_time: 0.1
#    Each pass waits for queued setup/backoff/retract to finish, then requires
#    >=50 fresh contiguous samples over this duration. Preparation times out
#    after baseline_time+0.5s if no complete quiet window qualifies. This also
#    applies to already enabled motors and second touches. Earlier buffered
#    samples cannot qualify. No post-arm impact is intentionally ignored;
#    the check does not change driver current or hold_current.
#baseline_noise_floor: 0.2
#    Generic configured accelerometers only, including Cartographer's ADXL/LIS.
#    Finite g value from 0 to 0.2. Per-axis stationary peak-to-peak limit is
#    max(0.20 * active impact threshold, baseline_noise_floor). Zero restores
#    the previous 20% rule. At a 0.5g candidate, the default quiet limit is
#    0.2g; the actual impact threshold stays 0.5g. Native Beacon retains its
#    existing 20% quiet limit, already-pressed handling and motion behavior.
#    For an accepted generic reference above the old gate, movement proof
#    discounts each axis's maximum observed deviation from its accepted mean.
#    Automatic direction needs a signed interval >=+30mm/s or <=-30mm/s;
#    uncertain drift keeps detection bidirectional. Raw impacts, manual
#    direction overrides and the startup deadline stay unchanged. Assumes later
#    stationary noise stays within those bounds; noisy/slow cases may fail
#    no_motion without a speed/threshold increase. Synthetic validation only.
#stream_timeout: 0.05
#travel_margin: 1.1
#watchdog_margin: 0.15
#    Detector timing/stop guards. Not hard real-time guarantees.

#stream_interval: 0.005
#max_sample_age: 0.020
#min_sample_rate: 1000
#max_report_travel: 1.0
#    Generic configured-sensor delivery guards (seconds, seconds, Hz, mm).
#    Reporting interval is temporarily shortened and restored afterwards.
#    Generic speed ceiling = max_report_travel/max_sample_age: 50mm/s with
#    default 1mm/0.020s. No separate fixed 50mm/s cap applies; every plan must
#    also satisfy the startup budget. Timing/acceleration are not auto-edited.
#    While no impact has completed the generic home, its startup guard fails
#    with no_motion if proof is absent by the ramp/lag/report deadline. It never
#    treats a stationary generic sensor as a successful already-pressed home.
#    Ordinary G28 may finish on a fresh threshold impact before motion proof;
#    calibration/test/charts additionally reject suspect motion/travel.
#    Before enable/backoff, plans exceeding a fixed 3mm nominal commanded
#    travel budget before the host stop request are rejected. No user option
#    disables that policy. At 50mm/s and 5000mm/s^2 with default age/interval,
#    the deadline is 55ms and the nominal budget is 2.65mm (includes one 3ms
#    watchdog interval). This excludes host stalls, transport and MCU stop
#    delay, so it does not guarantee physical stopping distance.
#    Runtime checks use live velocity/acceleration, even after a macro changes
#    them. homing_accel only caps live acceleration; zero leaves it unchanged.
#    At 50mm/s and live 1500mm/s^2, the same policy needs 3.233mm and refuses.
#    The error shows effective speed/acceleration and a lower homing_speed
#    ceiling. CALIBRATE/TEST/CHARTS check generic plans before workflow effects.
#sensor_range: 16
#    Actual configured sensor range in g, required for an unknown compatible
#    object; never infer it from the brand. Standard drivers have known ranges.

#calibration_start_threshold: 0.5
#calibration_step: 0.5
#calibration_max_threshold: 12.0
#calibration_max_attempts: 40
#calibration_confirm_timeout: 300
#calibration_travel_tolerance: 0.20
#workflow_reposition_speed: 50
#    Supervised workflow limits. Threshold also stops at 80% of sensor range.
#    Calibration starts at 0.5g by default; calibration_start_threshold has a
#    0.5g minimum. An explicit existing start value is preserved; set it to 0.5
#    or leave it absent for this default. Existing 1g and 2g models remain valid;
#    saved thresholds stay until recalibration.
#    Before starting, physically center XY by hand using appropriate
#    XY motor controls, keep Z supported, and leave both XY axes unhomed.
#    Ensure nozzle/bed clearance for XY travel before CALIBRATE/TEST/CHARTS;
#    these X/Y-only workflows do not perform safe_z_home's Z hop.
#    Run ACCEL_HOMING_CALIBRATE AXIS=X CENTERED=1 (or AXIS=Y for Y).
#    CENTERED=1 declares existing manual centering and consents to movement;
#    it is not a measured position. The first home tests the actual candidate.
#    A clean run is one discovery + ten additional accepted validations.
#    Every validation must pass the default 20% center-travel geometry check.
#    The TEN validations must also have max(travel_mm)-min(travel_mm) <1.5mm;
#    exactly 1.5mm fails. Discovery/manual centering are excluded. This fixed
#    limit has no option. X/Y windows are independent. Reaching the limit
#    aborts before another automatic move without raising the candidate,
#    staging/saving a model or restarting. Progress/model metadata show range.
#    Commanded steps are not encoder measurements and do not prove contact
#    with the correct stop or absence of skipped steps. Existing saved models
#    remain loadable but need new calibration to qualify under this rule.
#    Between accepted trials, only the tested axis returns to center.
#    An early trigger raises the candidate by calibration_step (first retry
#    1.0g by default), clears the validation window and releases/invalidates XY.
#    This includes pressed/<=10mm hits and triggers below the geometry window.
#    A new candidate needs a new qualifying discovery and ten validations. Center
#    XY by hand again and reissue the SAME calibration command to resume the
#    pending candidate and attempt count, keeping AXIS and optional SAVE_CONFIG
#    unchanged; there is no automatic return after a suspect result.
#    TEST/CHARTS require the same existing manual center and both XY unhomed:
#    ACCEL_HOMING_TEST CENTERED=1 or
#    ACCEL_HOMING_CHARTS_GENERATE CENTERED=1 starts directly, without a separate
#    confirmation or preliminary XY release. CENTERED=1 authorizes movement.
#    Early calibration hits print recentering instructions in the console;
#    the pending calibration retains calibration_confirm_timeout.
#    Calibration saves its axis and restarts by default (SAVE_CONFIG=1).
#    SAVE_CONFIG=0 only stages the model in memory; it does not change ordinary
#    homing thresholds. Run SAVE_CONFIG manually to write/restart and activate
#    the model after reload (manual overrides still take priority). An ordinary
#    RESTART discards unsaved staged values.
#charts_directory: ~/printer_data/config/accel_homing_charts
#    Default actually follows the selected main printer.cfg's directory.

# The installer edits these options in your EXISTING stepper sections:
# [stepper_x]
# endstop_pin: accel_homing:x
# homing_retract_dist: 0
# [stepper_y]
# endstop_pin: accel_homing:y
# homing_retract_dist: 0
# It preserves configured homing_speed for every sensor. Generic plans outside
# reporting or startup-request limits are refused before installation writes;
# no automatic cap/reduction is applied. Only explicit --homing-speed requests
# a speed edit, still subject to those limits. Acceleration is never raised.
# An update keeps a speed written by an older installer; it does not infer or
# automatically restore the original speed from retained backup history.
# It comments X/Y TMC diag_pin/diag0_pin/diag1_pin/home_current and rail
# homing_accel/min_home_dist, leaving run_current and unrelated axes untouched.
# Calibration/test/charts require Cartesian/CoreXY, independent Z and a sensor
# moving on both axes. Stock G28 is supported directly or beneath the verified
# standard Klipper/Kalico safe_z_home handler; workflow X/Y homes bypass its
# z_hop. Normal G28/Z and probe settings retain their configured behavior.
# Public G28 X/Y can still Z-hop before a later X/Y policy refusal; workflow
# preflight does not intercept public G28 or change safe_z_home/Z settings.
# homing_override, G28 macros and unknown/custom wrapper chains are rejected.
