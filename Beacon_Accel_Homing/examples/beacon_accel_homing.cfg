# Historical Beacon configuration remains accepted. Do not load this section
# together with [accel_homing]. New installations use examples/accel_homing.cfg.
[beacon_accel_homing]
beacon: beacon
#accel_chip: beacon
#    Optional explicit selection; omitted keeps the legacy Beacon default.
#x_threshold: 8.0
#y_threshold: 8.0
#    Independent editable overrides. Leave commented to use saved model values.
#    Any finite positive g value is accepted, with no fixed 3-15g range.
#    When Beacon reports its range, the threshold must be at most 80% of it;
#    the actual stream range is checked again before arming.
#threshold: 8.0
#    Historical shared fallback; explicit X/Y values override it.
#model: default
#homing_accel: 5000
#    Also caps final release and bounded early reversals without raising a lower
#    live acceleration; normal acceleration is restored afterward.
#back_off_dist: 5
#    Final successful XY release and existing cross-axis release, mm (0-20).
#    Zero disables. Keep homing_retract_dist: 0 for one touch; this is not a
#    second touch. Rail limits/firmware release bound the final away move.
#    Workflows release only their final qualified axis, never a suspect trial.
#baseline_time: 0.1
#    Each pass needs >=50 fresh contiguous samples over this duration.
#    Per-axis peak-to-peak limit: max(0.20 * threshold, min(0.5g, threshold)).
#    This bounded quiet-reference floor does not raise the impact threshold.
#    References above the former 20% limit use bounded motion/pressed checks;
#    ambiguity fails no_motion. Raw impacts remain eligible immediately.
#    Simple CALIBRATE and new vector models skip quietness/motion-proof gates,
#    retaining a fresh offset and data checks. They detect XYZ magnitude.
#    Require a discovery impact AFTER 20mm; crossing 20mm alone is not enough.
#    Discovery and every validation impact beyond 20mm must fit the configured
#    midpoint-to-endstop distance within calibration_travel_tolerance (default 20%).
#    An implausible >20mm hit aborts without recentering or raising the threshold;
#    manually center XY and prepare a new command. Distance does not prove contact.
#    Center only the selected axis, then run ten centered checks, excluding
#    discovery. <=2mm spread passes after ten checks. A running spread >2mm
#    rejects immediately, raises the candidate by STEP and restarts discovery
#    with ten fresh passing checks still required.
#    Legacy models/manual overrides retain the prior detector described above.
#calibration_start_threshold: 1.0
#calibration_step: 0.25
#calibration_settle_time: 0.25
#    CALIBRATE and ACCURACY wait this long after completed midpoint returns,
#    before the next reference; finite 0-2, zero disables the extra wait.
#    Midpoint returns share ordinary acceleration restored after homing.
#    Bounded early reversals retain their homing_accel cap and this wait.
#    TEST/CHARTS returns and homing speed/cap are unchanged.
#    Run ACCEL_HOMING_CALIBRATE AXIS=X CENTERED=1 (use AXIS=Y for Y).
#    Each new command first measures three stationary 1s noise windows.
#    Fresh XYZ magnitude selects the initial value on the configured start/step
#    grid; STEP alone changes spacing. START_THRESHOLD=1 STEP=0.25 forces those
#    values for a run but still measures noise. Candidate retries do not remeasure.
#stream_timeout: 0.05
#travel_margin: 1.1
#watchdog_margin: 0.15
#    ACCEL_HOMING_CALIBRATE_NOISE optionally measures three stationary 1s XYZ
#    vibration windows in g and exports one ready-to-open three-panel PNG.
#    All charts are PNG only, timestamped in UTC; no CSV/JSON/SVG/HTML sidecars.
#    Plots preserve signed extrema in bounded traces, not every raw sample.
#    It performs no move,
#    motor enable/release, homing, SAVE_CONFIG or restart. Its mapped X/Y hints
#    are diagnostic; CALIBRATE always measures fresh XYZ magnitude instead.
#    Ordinary thresholds remain unchanged by this stationary diagnostic.
#    Candidate = peak + max(20%, 0.1g), rounded UP on the configured start/step
#    grid; it is NOT a calibrated impact threshold or a noise filter. An
#    unknown native physical range or over-ceiling candidate gives no seed,
#    while retaining the charts. Without explicit START_THRESHOLD, an unavailable
#    fresh magnitude candidate aborts CALIBRATE before movement. Acquisition or
#    PNG-export faults abort even with explicit START_THRESHOLD. Stationary noise
#    does not measure startup/travel transients or prove a minimum threshold.
#    Quiet-baseline gates remain unchanged.

# Existing stepper sections keep their historical pin aliases:
# [stepper_x]
# endstop_pin: beacon_accel:x
# homing_retract_dist: 0
# [stepper_y]
# endstop_pin: beacon_accel:y
# homing_retract_dist: 0
# The transactional installer preserves existing explicit x/y thresholds,
# selects the configured Beacon and disables only associated sensorless options.
# See ../README.md for supervised commands, saved models and physical limits.
