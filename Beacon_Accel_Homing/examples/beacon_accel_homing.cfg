# Historical Beacon configuration remains accepted. Do not load this section
# together with [accel_homing]. New installations use examples/accel_homing.cfg.
[beacon_accel_homing]
beacon: beacon
#accel_chip: beacon
#    Optional explicit selection; omitted keeps the legacy Beacon default.
#x_threshold: 8.0
#y_threshold: 8.0
#    Independent editable overrides. Leave commented to use saved model values.
#    Any finite positive g value is accepted, with no fixed 3-15g range.
#    When Beacon reports its range, the threshold must be at most 80% of it;
#    the actual stream range is checked again before arming.
#threshold: 8.0
#    Historical shared fallback; explicit X/Y values override it.
#model: default
#homing_accel: 5000
#    Also caps final release without raising a lower live acceleration;
#    normal acceleration is restored afterward.
#back_off_dist: 5
#    Final successful XY release and existing cross-axis release, mm (0-20).
#    Zero disables. Keep homing_retract_dist: 0 for one touch; this is not a
#    second touch. Rail limits/firmware release bound the final away move.
#    Workflows release only their final qualified axis, never a suspect trial.
#baseline_time: 0.1
#    Each pass needs >=50 fresh contiguous samples over this duration.
#    Per-axis peak-to-peak limit: max(0.20 * threshold, min(0.5g, threshold)).
#    This bounded quiet-reference floor does not raise the impact threshold.
#    References above the former 20% limit use bounded motion/pressed checks;
#    ambiguity fails no_motion. Raw impacts remain eligible immediately.
#stream_timeout: 0.05
#travel_margin: 1.1
#watchdog_margin: 0.15
#    ACCEL_HOMING_CALIBRATE_NOISE optionally measures three stationary 1s XYZ
#    vibration windows in g and exports one ready-to-open three-panel PNG.
#    All charts are PNG only, timestamped in UTC; no CSV/JSON/SVG/HTML sidecars.
#    Plots preserve signed extrema in bounded traces, not every raw sample.
#    It performs no move,
#    motor enable/release, homing, SAVE_CONFIG or restart. A later CALIBRATE can
#    use its transient axis candidate until restart/context change; repeat
#    measurement before Y after X autosave/restart. Ordinary thresholds stay.
#    Candidate = peak + max(20%, 0.1g), rounded UP on the configured start/step
#    grid; it is NOT a calibrated impact threshold or a noise filter. An
#    unknown native physical range or over-ceiling candidate gives no seed,
#    while retaining the charts. Quiet-baseline gates remain unchanged.

# Existing stepper sections keep their historical pin aliases:
# [stepper_x]
# endstop_pin: beacon_accel:x
# homing_retract_dist: 0
# [stepper_y]
# endstop_pin: beacon_accel:y
# homing_retract_dist: 0
# The transactional installer preserves existing explicit x/y thresholds,
# selects the configured Beacon and disables only associated sensorless options.
# See ../README.md for supervised commands, saved models and physical limits.
